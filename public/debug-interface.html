<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调试界面 - 详细日志</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .card {
      background: #2d2d2d;
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      border: 1px solid #444;
    }
    h1 { color: #4CAF50; margin-bottom: 10px; }
    .logs {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      margin: 20px 0;
    }
    .log-item {
      padding: 4px 0;
      border-bottom: 1px solid #222;
    }
    .log-success { color: #4CAF50; }
    .log-error { color: #f44336; }
    .log-warning { color: #ff9800; }
    .log-info { color: #2196F3; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #bbb;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 6px;
      font-size: 14px;
      background: #1a1a1a;
      color: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #45a049; }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .progress-section {
      display: none;
    }
    .progress-bar {
      width: 100%;
      height: 40px;
      background: #444;
      border-radius: 20px;
      overflow: hidden;
      margin: 15px 0;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }
    .report-section {
      display: none;
      background: #1b5e20;
      border-left: 4px solid #4CAF50;
    }
    .timer {
      font-size: 32px;
      font-weight: bold;
      color: #4CAF50;
      text-align: center;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      margin: 10px 0;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .status-item {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid #4CAF50;
    }
    .status-label {
      color: #888;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .status-value {
      font-size: 20px;
      font-weight: bold;
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔍 调试界面 - 详细日志模式</h1>
      <p style="color: #888;">时间戳: <span id="timestamp"></span></p>
    </div>

    <div class="card">
      <h2>📝 生成视频</h2>
      <div class="form-group">
        <label>显示文本 *</label>
        <textarea id="textContent" required>测试滑动动画</textarea>
      </div>

      <div class="form-group">
        <label>背景音乐 *</label>
        <input type="file" id="musicFile" accept="audio/*" required>
      </div>

      <div class="form-group">
        <label>幻灯片时长（秒）</label>
        <input type="number" id="duration" value="5" min="1" max="300">
      </div>

      <div class="form-group">
        <label>动画效果</label>
        <select id="animation">
          <option value="none">无动画</option>
          <option value="fade" selected>淡入淡出</option>
          <option value="slide_left">从右向左滑入</option>
          <option value="slide_right">从左向右滑入</option>
          <option value="slide_up">从下向上滑入</option>
          <option value="slide_down">从上向下滑入</option>
        </select>
      </div>

      <button id="generateBtn" onclick="generateVideo()">🚀 生成视频</button>
      <button onclick="clearLogs()" style="background: #666; margin-left: 10px;">清除日志</button>
    </div>

    <!-- 状态监控 -->
    <div class="card status-section" id="statusSection" style="display: none;">
      <h2>📊 实时状态监控</h2>
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">视频ID</div>
          <div class="status-value" id="statusVideoId">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">状态</div>
          <div class="status-value" id="statusState">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">进度</div>
          <div class="status-value" id="statusProgress">0%</div>
        </div>
        <div class="status-item">
          <div class="status-label">计时器状态</div>
          <div class="status-value" id="statusTimer">未启动</div>
        </div>
        <div class="status-item">
          <div class="status-label">轮询状态</div>
          <div class="status-value" id="statusPolling">未启动</div>
        </div>
        <div class="status-item">
          <div class="status-label">累计时间</div>
          <div class="status-value timer" id="timer">0秒</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
    </div>

    <!-- 报告区域 -->
    <div class="card report-section" id="reportSection">
      <h2>✅ 生成完成！</h2>
      <div style="padding: 20px;">
        <p><strong>⏱️ 视频时长:</strong> <span id="reportDuration">-</span></p>
        <p><strong>📦 文件大小:</strong> <span id="reportSize">-</span></p>
        <p><strong>🎬 视频格式:</strong> <span id="reportFormat">-</span></p>
        <p><strong>⏰ 总耗时:</strong> <span id="reportTime">-</span></p>
        <a id="downloadLink" href="#" download style="display: inline-block; margin-top: 15px; padding: 12px 30px; background: #4CAF50; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">⬇️ 下载视频</a>
      </div>
    </div>

    <!-- 日志区域 -->
    <div class="card">
      <h2>📋 详细日志</h2>
      <div class="logs" id="logs"></div>
    </div>
  </div>

  <script>
    document.getElementById('timestamp').textContent = new Date().toLocaleString();

    let currentVideoId = null;
    let timerInterval = null;
    let pollingInterval = null;
    let startTime = null;
    let logCount = 0;

    // 日志函数
    function log(message, type = 'info') {
      logCount++;
      const timestamp = new Date().toLocaleTimeString() + '.' + new Date().getMilliseconds();
      const logItem = document.createElement('div');
      logItem.className = `log-item log-${type}`;
      logItem.textContent = `[${logCount}] [${timestamp}] ${message}`;
      
      const logsDiv = document.getElementById('logs');
      logsDiv.insertBefore(logItem, logsDiv.firstChild);
      
      console.log(`[${timestamp}] ${message}`);
      
      // 限制日志数量
      if (logsDiv.children.length > 100) {
        logsDiv.removeChild(logsDiv.lastChild);
      }
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      logCount = 0;
      log('日志已清除', 'info');
    }

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const mb = bytes / 1024 / 1024;
      return mb.toFixed(2) + ' MB';
    }

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '0:00';
      const totalSeconds = Math.floor(parseFloat(seconds));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // 更新状态显示
    function updateStatus() {
      document.getElementById('statusVideoId').textContent = currentVideoId || '-';
      document.getElementById('statusTimer').textContent = timerInterval ? '运行中 ✅' : '已停止 ⭕';
      document.getElementById('statusTimer').style.color = timerInterval ? '#4CAF50' : '#f44336';
      document.getElementById('statusPolling').textContent = pollingInterval ? '运行中 ✅' : '已停止 ⭕';
      document.getElementById('statusPolling').style.color = pollingInterval ? '#4CAF50' : '#f44336';
    }

    // 生成视频
    async function generateVideo() {
      log('=== 开始生成视频 ===', 'info');
      
      const textContent = document.getElementById('textContent').value;
      const musicFile = document.getElementById('musicFile').files[0];
      const duration = document.getElementById('duration').value;
      const animation = document.getElementById('animation').value;

      if (!textContent || !musicFile) {
        log('❌ 请填写文本内容并上传音乐文件', 'error');
        alert('请填写文本内容并上传音乐文件！');
        return;
      }

      log(`📝 文本: ${textContent.substring(0, 30)}...`, 'info');
      log(`🎵 音乐: ${musicFile.name}`, 'info');
      log(`⏱️ 时长: ${duration}秒`, 'info');
      log(`🎬 动画: ${animation}`, 'info');

      // 创建视频记录
      const formData = new FormData();
      formData.append('text_content', textContent);
      formData.append('background_music', musicFile);
      formData.append('slide_duration', duration);
      formData.append('text_animation', animation);
      formData.append('video_format', 'mp4');

      document.getElementById('generateBtn').disabled = true;
      log('⏸️  生成按钮已禁用', 'info');

      try {
        log('📤 发送创建请求...', 'info');
        const createResp = await fetch('/api/videos/create', {
          method: 'POST',
          body: formData
        });
        const createData = await createResp.json();
        
        if (!createData.success) {
          throw new Error('创建视频失败');
        }

        currentVideoId = createData.data.id;
        log(`✅ 视频记录创建成功, ID: ${currentVideoId}`, 'success');

        // 开始生成
        log('🚀 发送生成请求...', 'info');
        const genResp = await fetch(`/api/videos/${currentVideoId}/generate`, {
          method: 'POST'
        });
        log('✅ 生成请求已发送', 'success');

        // 显示状态界面
        document.getElementById('statusSection').style.display = 'block';
        document.getElementById('reportSection').style.display = 'none';
        updateStatus();

        // 启动计时器
        startTime = Date.now();
        log('⏱️  启动计时器', 'success');
        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          document.getElementById('timer').textContent = elapsed + '秒';
        }, 1000);
        updateStatus();

        // 启动轮询
        startPolling();

      } catch (error) {
        log(`❌ 生成失败: ${error.message}`, 'error');
        alert('生成失败: ' + error.message);
        document.getElementById('generateBtn').disabled = false;
        log('▶️  生成按钮已启用', 'info');
      }
    }

    // 轮询进度
    function startPolling() {
      log('🔄 启动进度轮询（每2秒一次）', 'success');
      
      let pollCount = 0;
      
      pollingInterval = setInterval(async () => {
        pollCount++;
        
        try {
          const resp = await fetch(`/api/videos/${currentVideoId}`);
          const data = await resp.json();

          if (data.success) {
            const video = data.data;
            
            // 详细记录状态信息
            log(`[轮询#${pollCount}] 进度: ${video.generation_progress}%, 状态: ${video.generation_status}`, 
                video.generation_status === 'completed' ? 'success' : 'info');
            
            // 显示原始数据
            if (pollCount % 5 === 0) {  // 每5次轮询显示一次详细数据
              log(`[调试] 原始状态值: "${video.generation_status}" (类型: ${typeof video.generation_status}, 长度: ${video.generation_status ? video.generation_status.length : 0})`, 'warning');
              log(`[调试] 条件判断: video.generation_status === 'completed' → ${video.generation_status === 'completed'}`, 'warning');
              log(`[调试] 完整数据: ${JSON.stringify({status: video.generation_status, progress: video.generation_progress, id: video.id}).substring(0, 150)}`, 'info');
            }

            // 更新显示
            document.getElementById('statusState').textContent = video.generation_status;
            document.getElementById('statusProgress').textContent = video.generation_progress + '%';
            document.getElementById('progressFill').style.width = video.generation_progress + '%';
            document.getElementById('progressFill').textContent = video.generation_progress + '%';

            // 检查是否完成 - 添加多种检查方式
            const isCompleted = video.generation_status === 'completed' || 
                               String(video.generation_status).trim() === 'completed' ||
                               video.generation_progress >= 100;
            
            log(`[调试] isCompleted = ${isCompleted}`, isCompleted ? 'success' : 'warning');
            
            if (isCompleted) {
              log('', 'success');
              log('═══════════════════════════════════', 'success');
              log('✅✅✅ 视频生成完成！✅✅✅', 'success');
              log('═══════════════════════════════════', 'success');
              log('', 'success');
              
              // 停止计时器
              log('🛑 准备停止计时器...', 'warning');
              if (timerInterval) {
                log(`🛑 停止计时器 (ID: ${timerInterval})`, 'warning');
                clearInterval(timerInterval);
                timerInterval = null;
                log('✅ 计时器已停止并清空', 'success');
              } else {
                log('⚠️  计时器已经是null', 'warning');
              }

              // 停止轮询
              log('🛑 准备停止轮询...', 'warning');
              if (pollingInterval) {
                log(`🛑 停止轮询 (ID: ${pollingInterval})`, 'warning');
                clearInterval(pollingInterval);
                pollingInterval = null;
                log('✅ 轮询已停止并清空', 'success');
              } else {
                log('⚠️  轮询已经是null', 'warning');
              }

              updateStatus();
              log('📊 状态显示已更新', 'info');

              // 显示报告
              log('📝 准备显示生成报告...', 'info');
              showReport(video);
            } else if (video.generation_status === 'failed') {
              log(`❌ 视频生成失败: ${video.error_message || '未知错误'}`, 'error');
              stopAllTimers();
              alert('视频生成失败');
            }
          }
        } catch (error) {
          log(`❌ 轮询失败: ${error.message}`, 'error');
        }
      }, 2000);
      
      updateStatus();
    }

    // 停止所有计时器
    function stopAllTimers() {
      log('🛑 强制停止所有计时器...', 'warning');
      
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        log('✅ 计时器已强制停止', 'success');
      }
      
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        log('✅ 轮询已强制停止', 'success');
      }
      
      updateStatus();
    }

    // 显示生成报告
    function showReport(video) {
      log('📝 showReport() 函数被调用', 'info');
      log(`📦 视频数据: ${JSON.stringify(video).substring(0, 100)}...`, 'info');

      const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
      log(`⏰ 计算总耗时: ${elapsed}秒`, 'info');

      // 隐藏进度，显示报告
      log('🎨 切换显示区域...', 'info');
      document.getElementById('statusSection').style.display = 'none';
      document.getElementById('reportSection').style.display = 'block';

      // 填充数据
      log('📊 填充报告数据...', 'info');
      document.getElementById('reportDuration').textContent = formatDuration(video.video_duration);
      document.getElementById('reportSize').textContent = formatSize(video.video_file_size);
      document.getElementById('reportFormat').textContent = (video.video_format || 'mp4').toUpperCase();
      document.getElementById('reportTime').textContent = elapsed + '秒';

      // 下载链接
      log('🔗 设置下载链接...', 'info');
      const downloadLink = document.getElementById('downloadLink');
      downloadLink.href = `/outputs/${video.video_filename}`;
      downloadLink.download = video.video_filename;
      log(`✅ 下载链接: ${downloadLink.href}`, 'success');

      // 重新启用按钮
      document.getElementById('generateBtn').disabled = false;
      log('▶️  生成按钮已重新启用', 'info');

      log('', 'success');
      log('═══════════════════════════════════', 'success');
      log('🎉🎉🎉 所有操作完成！🎉🎉🎉', 'success');
      log('═══════════════════════════════════', 'success');
      log('', 'success');

      alert('🎉 视频生成成功！耗时 ' + elapsed + ' 秒\n\n请查看绿色报告卡片和下载按钮');
    }

    // 初始化
    log('🚀 调试界面已加载', 'success');
    log(`📱 用户代理: ${navigator.userAgent}`, 'info');
    log('⏰ 时间戳: ' + new Date().toLocaleString(), 'info');
  </script>
</body>
</html>
