<body>
  <div class="container">
    <div class="alert">
      🔥 这是新的独立界面 - 完全绕过缓存问题！时间戳: <?php echo time(); ?>
    </div>

    <div class="card">
      <h1>🎬 视频生成器</h1>
      <p>独立界面 - 内联JavaScript - 无缓存</p>
      
      <div class="form-group">
        <label>显示文本 *</label>
        <textarea id="textContent" required>测试文本</textarea>
      </div>

      <div class="form-group">
        <label>背景音乐 *</label>
        <input type="file" id="musicFile" accept="audio/*" required>
      </div>

      <div class="form-group">
        <label>幻灯片时长（秒）</label>
        <input type="number" id="duration" value="5" min="1" max="300">
      </div>

      <div class="form-group">
        <label>视频清晰度</label>
        <select id="resolution">
          <option value="1080p" selected>1080P (1920x1080)</option>
          <option value="2k">2K (2560x1440)</option>
          <option value="3k">3K (3200x1800)</option>
          <option value="4k">4K (3840x2160)</option>
        </select>
      </div>

      <div class="form-group">
        <label>动画效果</label>
        <select id="animation">
          <option value="none">无动画</option>
          <option value="fade" selected>淡入淡出</option>
          <option value="slide_left">从右向左滑入</option>
          <option value="slide_right">从左向右滑入</option>
          <option value="slide_up">从下向上滑入</option>
          <option value="slide_down">从上向下滑入</option>
          <option value="zoom_in">放大</option>
          <option value="zoom_out">缩小</option>
          <option value="rotate">旋转（强调效果）</option>
          <option value="bounce">弹跳（脉冲效果）</option>
        </select>
        <small style="color: #666;">💡 所有动画效果现已可用</small>
      </div>

      <button id="generateBtn" onclick="generateVideo()">🚀 生成视频</button>
    </div>

    <!-- 进度区域 -->
    <div class="card progress-section" id="progressSection">
      <h2>📊 生成进度</h2>
      <div class="timer" id="timer">0秒</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div class="status info" id="statusText">准备中...</div>
    </div>

    <!-- 报告区域 -->
    <div class="card report-section" id="reportSection">
      <h2>✅ 生成完成！</h2>
      <div class="report-item">
        <strong>⏱️ 视频时长:</strong> <span id="reportDuration">-</span>
      </div>
      <div class="report-item">
        <strong>📦 文件大小:</strong> <span id="reportSize">-</span>
      </div>
      <div class="report-item">
        <strong>🎬 视频格式:</strong> <span id="reportFormat">-</span>
      </div>
      <div class="report-item">
        <strong>⏰ 总耗时:</strong> <span id="reportTime">-</span>
      </div>
      <a id="downloadLink" class="download-btn button" href="#" download>⬇️ 下载视频</a>
    </div>

    <!-- 视频列表 -->
    <div class="card">
      <h2>📋 视频列表</h2>
      <button onclick="loadVideos()">🔄 刷新列表</button>
      <table class="list-table" id="videoList">
        <thead>
          <tr>
            <th>ID</th>
            <th>文本内容</th>
            <th>状态</th>
            <th>时长</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="videoListBody">
          <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 内联JavaScript - 完全独立
    console.log('%c🔥 新界面加载完成 - 时间戳: ' + Date.now(), 'color: #ff5722; font-size: 16px; font-weight: bold;');
    
    let currentVideoId = null;
    let timerInterval = null;
    let pollingInterval = null;
    let startTime = null;

    // 格式化文件大小
    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const mb = bytes / 1024 / 1024;
      return mb.toFixed(2) + ' MB';
    }

    // 格式化时长
    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '0:00';
      const totalSeconds = Math.floor(parseFloat(seconds));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // 生成视频
    async function generateVideo() {
      console.log('🎬 开始生成视频...');
      
      const textContent = document.getElementById('textContent').value;
      const musicFile = document.getElementById('musicFile').files[0];
      const duration = document.getElementById('duration').value;
      const resolution = document.getElementById('resolution').value;
      const animation = document.getElementById('animation').value;

      if (!textContent || !musicFile) {
        alert('请填写文本内容并上传音乐文件！');
        return;
      }

      // 1. 创建视频记录
      const formData = new FormData();
      formData.append('text_content', textContent);
      formData.append('background_music', musicFile);
      formData.append('slide_duration', duration);
      formData.append('text_animation', animation);
      formData.append('video_format', 'mp4');

      document.getElementById('generateBtn').disabled = true;

      try {
        const createResp = await fetch('/api/videos/create', {
          method: 'POST',
          body: formData
        });
        const createData = await createResp.json();
        
        if (!createData.success) {
          throw new Error('创建视频失败');
        }

        currentVideoId = createData.data.id;
        console.log('✅ 视频记录创建成功, ID:', currentVideoId);

        // 2. 开始生成
        const genResp = await fetch(`/api/videos/${currentVideoId}/generate`, {
          method: 'POST'
        });

        // 3. 显示进度界面
        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('reportSection').style.display = 'none';

        // 4. 启动计时器
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          document.getElementById('timer').textContent = elapsed + '秒';
        }, 1000);

        // 5. 启动轮询
        startPolling();

      } catch (error) {
        console.error('❌ 生成失败:', error);
        alert('生成失败: ' + error.message);
        document.getElementById('generateBtn').disabled = false;
      }
    }

    // 轮询进度
    function startPolling() {
      console.log('🔄 启动进度轮询...');
      
      pollingInterval = setInterval(async () => {
        try {
          const resp = await fetch(`/api/videos/${currentVideoId}`);
          const data = await resp.json();

          if (data.success) {
            const video = data.data;
            console.log(`📊 进度: ${video.generation_progress}%, 状态: ${video.generation_status}`);

            // 更新进度条
            document.getElementById('progressFill').style.width = video.generation_progress + '%';
            document.getElementById('progressFill').textContent = video.generation_progress + '%';
            document.getElementById('statusText').textContent = 
              video.generation_status === 'completed' ? '✅ 生成完成！' : '正在生成...';

            // 检查是否完成
            if (video.generation_status === 'completed') {
              console.log('%c✅ 视频生成完成！', 'color: #4CAF50; font-size: 18px; font-weight: bold;');
              
              // 停止计时器
              if (timerInterval) {
                console.log('🛑 停止计时器');
                clearInterval(timerInterval);
                timerInterval = null;
              }

              // 停止轮询
              if (pollingInterval) {
                console.log('🛑 停止轮询');
                clearInterval(pollingInterval);
                pollingInterval = null;
              }

              // 显示报告
              showReport(video);
            }
          }
        } catch (error) {
          console.error('轮询失败:', error);
        }
      }, 2000);
    }

    // 显示生成报告
    function showReport(video) {
      console.log('📝 显示生成报告:', video);

      const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;

      // 隐藏进度，显示报告
      document.getElementById('progressSection').style.display = 'none';
      document.getElementById('reportSection').style.display = 'block';

      // 填充数据
      document.getElementById('reportDuration').textContent = formatDuration(video.video_duration);
      document.getElementById('reportSize').textContent = formatSize(video.video_file_size);
      document.getElementById('reportFormat').textContent = (video.video_format || 'mp4').toUpperCase();
      document.getElementById('reportTime').textContent = elapsed + '秒';

      // 下载链接
      const downloadLink = document.getElementById('downloadLink');
      downloadLink.href = `/outputs/${video.video_filename}`;
      downloadLink.download = video.video_filename;

      // 重新启用按钮
      document.getElementById('generateBtn').disabled = false;

      // 刷新列表
      loadVideos();

      alert('🎉 视频生成成功！耗时 ' + elapsed + ' 秒');
    }

    // 加载视频列表
    async function loadVideos() {
      console.log('📋 加载视频列表...');
      
      try {
        const resp = await fetch('/api/videos');
        const data = await resp.json();

        if (data.success) {
          const tbody = document.getElementById('videoListBody');
          tbody.innerHTML = '';

          data.data.videos.forEach(v => {
            const row = tbody.insertRow();
            row.innerHTML = `
              <td>${v.id}</td>
              <td>${v.text_content.substring(0, 20)}...</td>
              <td>
                <span class="badge ${v.generation_status === 'completed' ? 'completed' : 'generating'}">
                  ${v.generation_status === 'completed' ? '已完成' : '生成中'}
                </span>
              </td>
              <td>${formatDuration(v.video_duration)}</td>
              <td>
                ${v.generation_status === 'completed' ? 
                  `<a href="/outputs/${v.video_filename}" download class="download-btn" style="padding: 6px 12px; font-size: 12px;">下载</a>` : 
                  '等待中...'}
              </td>
            `;
          });

          console.log('✅ 列表加载完成，共 ' + data.data.videos.length + ' 个视频');
        }
      } catch (error) {
        console.error('❌ 加载列表失败:', error);
      }
    }

    // 页面加载时加载列表
    window.addEventListener('load', () => {
      console.log('🚀 页面加载完成');
      loadVideos();
    });

    // 定期刷新列表
    setInterval(loadVideos, 10000);
  </script>
</body>
</html>
